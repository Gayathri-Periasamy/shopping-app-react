<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      
      const repo = "/shopping-app-react";
      const path = window.location.pathname.replace(repo,"");

      // Redirect to index.html and preserve path
      window.location.replace(
        repo + "/index.html?redirect=" + path
      );
    </script>
  </head>
  <body></body>
</html>
