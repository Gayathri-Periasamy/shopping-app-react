<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      const path = window.location.pathname;
      const repo = "/shopping-app-react";

      // Redirect to index.html and preserve path
      window.location.replace(
        repo + "/index.html?redirect=" + path.replace(repo, "")
      );
    </script>
  </head>
  <body></body>
</html>
